name: CI Security and Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run check

      - name: Transaction guard tests
        run: npm run test:unit
